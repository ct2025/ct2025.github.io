<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CT Business Ventures</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header - Bright Blue */
    .header {
      height: 80px;
      background: #007bff;        /* basic bright blue */
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8em;
      font-weight: bold;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: row;
    }

    /* Sidebar - Dark Gray */
    .sidebar {
      width: 250px;
      background: #343a40;        /* basic dark gray */
      color: #fff;
      padding-top: 20px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar a {
      display: block;
      padding: 14px 20px;
      color: #fff;
      text-decoration: none;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background: #495057;        /* slightly lighter gray on hover */
    }

    /* Main content area - Light background */
    .content {
      flex: 1;
      background: #f8f9fa;        /* very light gray (almost white) */
      padding: 20px;
      overflow: auto;
    }

    /* Optional: give the iframe a clean white background too */
    iframe {
      background: white;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Top Header -->
  <div class="header">
    CT Business Ventures 
  </div>

  <div class="main-area">
    <!-- Left Navigation Menu -->
    <div class="sidebar">
      <ul>
        <li><a href="home.html" target="contentFrame">CTX</a></li>
        <li><a href="equipment.html" target="contentFrame">Equipment Inventory</a></li>
        <li><a href="maintenance.html" target="contentFrame">Maintenance Logs</a></li>
        <li><a href="safety.html" target="contentFrame">Safety Procedures</a></li>
        <li><a href="experiments.html" target="contentFrame">Running Experiments</a></li>
        <li><a href="reports.html" target="contentFrame">Reports & Analytics</a></li>
        <li><a href="personnel.html" target="contentFrame">Personnel & Training</a></li>
        <li><a href="documents.html" target="contentFrame">Documents & Manuals</a></li>
        <li><a href="contact.html" target="contentFrame">Contact & Support</a></li>
      </ul>
    </div>

    <!-- Main Content Area -->
    <div class="content">
      <iframe
        name="contentFrame"
        src="ctx.html"
        width="100%"
        height="100%"
        frameborder="0"
        style="border:none; display:block;">
      </iframe>
    </div>
  </div>
</div>
</body>
</html>
